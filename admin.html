<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام التميز الوظيفي – دواجن فلسطين</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f8f1;--card:#fff;--tx:#1b2330;--mut:#5a6677;--pri:#0f7a3a;--pri2:#e2f4e6;--bd:#d3e2d3;--ok:#0f7a3a;--bad:#c0392b;--gold:#e0a800;--navy:#20207f;--yel:#f4c20d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a14;--card:#18251d;--tx:#eaf2ec;--mut:#9db3a4;--pri:#3fd072;--pri2:#1d3a29;--bd:#2c4234;--ok:#5fdc8a;--bad:#ff8d80;--gold:#f4c20d;--navy:#9ea0ff;--yel:#f4c20d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
header{padding:18px 16px 16px;display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,#17175f,#20207f 50%,#0f7a3a);border-bottom:4px solid #00b030}
header img{width:72px;height:72px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
h1{margin:0;font-size:1.45rem;color:#fff}
header p{margin:2px 0 0;color:#e8f6ec;font-size:.92rem}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{background:#20207f;color:#fff;border-color:#20207f}
main{max-width:860px;margin:0 auto;padding:8px 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.card{border-top:3px solid var(--pri)}
.card h2,.card h3{margin:0 0 8px;color:var(--pri)}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:12px;padding:2px 10px;font-size:.85rem;margin-left:6px}
ul{margin:6px 0;padding-right:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.tile{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:14px;text-align:right;font:inherit;color:var(--tx)}
.tile:hover{border-color:var(--pri)}
.tile{border-right:4px solid var(--pri)}
.tile b{display:block;color:var(--navy)}
.tile span{color:var(--mut);font-size:.85rem}
label{display:block;margin:10px 0 4px;font-size:.9rem;color:var(--mut)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.crit{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--bd)}
.crit input{width:auto;margin-top:6px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 20px;font:inherit;cursor:pointer;margin-top:12px}
.btn.s{background:transparent;color:var(--bad);border:1px solid var(--bd);padding:3px 10px;margin:0}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.gold{color:var(--gold);font-weight:700}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
.note{font-size:.85rem;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--pri);border-radius:12px;padding:12px;text-align:center}
.kpi b{display:block;font-size:1.8rem;color:var(--navy)}
.kpi span{color:var(--mut);font-size:.85rem}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.9rem}
.bar i{display:block;height:14px;border-radius:7px;background:var(--pri);min-width:3px}
.bar em{width:150px;font-style:normal;flex:none}
.ubar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd);font-size:.9rem}.ubar button{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}.auth{max-width:380px;margin:20px auto;padding:0 14px}
#pr{display:none}
@media print{body>*{display:none!important}body>#pr{display:block!important;color:#000;background:#fff;padding:10px}}
html{font-size:13pt}
body{font-family:"Sakkal Majalla","Traditional Arabic",Tahoma,Arial,sans-serif;font-size:1rem}
button,input,select,textarea{font-family:inherit}
nav button,.note,th,td,label,.tile span,.kpi span,.bar,.ubar,.ubar button,.tag,.crit,.btn,input,select,textarea,.k,.k i{font-size:1rem}
</style>
<script src="firebase-config.js"></script>
<script src="seed.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import * as S from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
try{const app=initializeApp(window.FIREBASE_CONFIG);window.FB=Object.assign({},A,S,{initializeApp,app,auth:A.getAuth(app),db:S.getFirestore(app)})}catch(e){window.FBERR=e}
window.dispatchEvent(new Event("fbready"));
</script>
</head>

 try{let n=0;for(const c of ["evaluations","winners","honor","cancelled"]){const q=await FB.getDocs(FB.collection(FB.db,c));for(const d of q.docs){await FB.deleteDoc(d.ref);n++}}
  toast("تم حذف "+n+" سجل، والنظام فارغ الآن")}catch(e){toast("تعذر الحذف ("+(e.code||"")+")",true)}}
function toast(t,bad){const d=document.createElement("div");d.textContent=t;d.style.cssText="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;padding:10px 18px;border-radius:10px;color:#fff;font-size:14px;background:"+(bad?"#c0392b":"#0f7a3a");document.body.appendChild(d);setTimeout(()=>d.remove(),4500)}
async function cancelEv(b){const id=b.dataset.id,r=ALL.find(x=>x.id===id);if(!r)return;
 const why=prompt("إلغاء تقييم «"+r.name+"» ("+r.aw+" – "+r.per+")\nسيتمكن المشرف من إعادة تقييمه.\nاكتب سبب الإلغاء (اختياري):");
 if(why===null)return;
 try{const sn=await FB.getDoc(FB.doc(FB.db,"evaluations",id));
  await FB.setDoc(FB.doc(FB.db,"cancelled",id+"_"+Date.now()),Object.assign({},sn.data(),{cancelledAt:FB.serverTimestamp(),reason:why,cancelledBy:FB.auth.currentUser.email}));
  if(isWin(r)&&recs.find(x=>x.id===id))await setWinner({dataset:{id}});await FB.deleteDoc(FB.doc(FB.db,"evaluations",id));toast("تم إلغاء تقييم "+r.name)}
 catch(e){toast("تعذر الإلغاء ("+(e.code||"")+")",true)}}
function boot(){
 if(!window.FB)return showAuth('<div class="card"><p class="bad">تعذر الاتصال بـ Firebase. تأكد من ملف firebase-config.js ومن الاتصال بالإنترنت.</p></div>');
 FB.onAuthStateChanged(FB.auth,u=>{if(u&&u.email===AEMAIL)startAdmin();else location.replace("index.html")})}
if(window.FB||window.FBERR)boot();else window.addEventListener("fbready",boot);
</script>
