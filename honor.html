<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الشرف – دواجن فلسطين</title>
<style>
:root{--bg:#f3f8f1;--card:#fff;--tx:#1b2330;--mut:#5a6677;--pri:#0f7a3a;--bd:#d3e2d3;--navy:#20207f}
@media (prefers-color-scheme:dark){:root{--bg:#101a14;--card:#18251d;--tx:#eaf2ec;--mut:#9db3a4;--pri:#3fd072;--bd:#2c4234;--navy:#9ea0ff}}
html{font-size:13pt}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Sakkal Majalla","Traditional Arabic",Tahoma,Arial,sans-serif;font-size:1rem;line-height:1.7}
header{display:flex;align-items:center;justify-content:center;gap:16px;padding:18px 16px;background:linear-gradient(135deg,#17175f,#20207f 50%,#0f7a3a);border-bottom:4px solid #00b030;color:#fff;text-align:center}
header img{width:84px;height:84px;border-radius:50%;background:#fff;padding:2px}
h1{margin:0;font-size:2rem}header p{margin:2px 0 0;opacity:.9}
main{max-width:1000px;margin:0 auto;padding:16px 14px 40px}
.sec{margin:22px 0 8px;color:var(--navy);font-size:1.3rem;font-weight:700;border-right:5px solid var(--pri);padding-right:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.w{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--pri);border-radius:14px;padding:18px;text-align:center}
.w img,.av{width:120px;height:120px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:block;border:3px solid var(--pri)}
.av{display:flex;align-items:center;justify-content:center;background:var(--pri);color:#fff;font-size:3rem}
.w h3{margin:4px 0;font-size:1.25rem;color:var(--navy)}.aw{color:var(--pri);font-weight:700}.pe{color:var(--mut)}
.hero .w{border-top-width:6px}.hero .w img,.hero .av{width:170px;height:170px}.hero .w h3{font-size:1.6rem}
button{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 16px;cursor:pointer}
#tv{position:fixed;inset:0;background:linear-gradient(135deg,#17175f,#0f7a3a);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:9;padding:20px}
#tv img,#tv .av{width:min(42vh,70vw);height:min(42vh,70vw);border:6px solid #fff}
#tv h2{font-size:3rem;margin:14px 0 0}#tv .a{font-size:1.8rem;margin-top:6px}#tv .p{opacity:.85;font-size:1.3rem}
.note{color:var(--mut);text-align:center;margin:30px 0}
</style>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import * as S from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
try{const app=initializeApp(window.FIREBASE_CONFIG);window.FB=Object.assign({},S,{db:S.getFirestore(app)})}catch(e){window.FBERR=e}
window.dispatchEvent(new Event("fbready"));
</script></head>

<main><div style="text-align:center"><button onclick="startTV()">وضع الشاشة</button></div><div id="m"><p class="note">جارٍ التحميل...</p></div></main>
<div id="tv" onclick="stopTV()"></div>
<script>
const MN=["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"],ORD=["موظف الشهر","نجم الدوائر","نجوم العمليات","نجوم سيارات نقل الريش","الموظف المنضبط"];
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const pretty=p=>{const m=String(p).split("/");return m.length===2&&MN[+m[0]-1]?MN[+m[0]-1]+" "+m[1]:p};
let HON=[],tvT=null;
function person(w,y){return `<div class="w">${y.photo?`<img alt="" src="${esc(y.photo)}">`:`<div class="av">${esc((y.name||"؟")[0])}</div>`}<h3>${esc(y.name)}</h3><div class="aw">${esc(w.awardName)}</div><div class="pe">${esc(pretty(w.period))}</div></div>`}
function latest(){const by={};HON.forEach(w=>{if(!by[w.awardName]||w.ts>by[w.awardName].ts)by[w.awardName]=w});
 return Object.keys(by).sort((a,b)=>(ORD.indexOf(a)<0?9:ORD.indexOf(a))-(ORD.indexOf(b)<0?9:ORD.indexOf(b))).map(k=>by[k])}
function render(){const m=document.getElementById("m");
 if(!HON.length){m.innerHTML='<p class="note">لم يتم إعلان فائزين بعد.</p>';return}
 const L=latest(),hero=L.find(w=>w.awardName==="موظف الشهر"),rest=L.filter(w=>w!==hero),ids=new Set(L.map(w=>w.id)),old=HON.filter(w=>!ids.has(w.id)).sort((a,b)=>b.ts-a.ts);
 m.innerHTML=(hero?`<div class="sec">موظف الشهر</div><div class="grid hero">${hero.winners.map(y=>person(hero,y)).join("")}</div>`:"")
  +(rest.length?`<div class="sec">فائزون آخرون</div><div class="grid">${rest.map(w=>w.winners.map(y=>person(w,y)).join("")).join("")}</div>`:"")
  +(old.length?`<div class="sec">الأرشيف</div><div class="grid">${old.map(w=>w.winners.map(y=>person(w,y)).join("")).join("")}</div>`:"")}
function startTV(){const items=[];latest().forEach(w=>w.winners.forEach(y=>items.push([w,y])));if(!items.length)return;
 const tv=document.getElementById("tv");let i=0;
 const show=()=>{const [w,y]=items[i%items.length];i++;tv.innerHTML=(y.photo?`<img alt="" src="${esc(y.photo)}">`:`<div class="av">${esc((y.name||"؟")[0])}</div>`)+`<h2>${esc(y.name)}</h2><div class="a">${esc(w.awardName)}</div><div class="p">${esc(pretty(w.period))}</div>`};
 show();tv.style.display="flex";clearInterval(tvT);tvT=setInterval(show,7000);try{tv.requestFullscreen()}catch(e){}}
function stopTV(){clearInterval(tvT);document.getElementById("tv").style.display="none";try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
function boot(){if(!window.FB){document.getElementById("m").innerHTML='<p class="note">تعذر الاتصال. تحقق من ملف firebase-config.js.</p>';return}
 FB.onSnapshot(FB.collection(FB.db,"honor"),sn=>{HON=sn.docs.map(d=>Object.assign({id:d.id,ts:d.data().announcedAt?d.data().announcedAt.toMillis():0},d.data()));render()},()=>{document.getElementById("m").innerHTML='<p class="note">تعذر تحميل البيانات.</p>'})}
if(window.FB||window.FBERR)boot();else window.addEventListener("fbready",boot);
</script></body></html>
