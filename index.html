<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة التقييم – دواجن فلسطين</title>
<style>
:root{--bg:#f3f8f1;--card:#fff;--tx:#1b2330;--mut:#5a6677;--pri:#0f7a3a;--bd:#d3e2d3;--navy:#20207f;--bad:#c0392b}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,sans-serif;line-height:1.7;font-size:14pt}
header{padding:16px;background:linear-gradient(135deg,#17175f,#20207f 50%,#0f7a3a);color:#fff;text-align:center}
main{max-width:800px;margin:15px auto;padding:0 12px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--pri);border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;margin:10px 0 4px;font-size:.95rem;color:var(--mut)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);font:inherit;box-sizing:border-box}
.crit{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--bd)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:12px;font:inherit;cursor:pointer;width:100%;font-weight:bold;margin-top:15px}
.ok{color:var(--pri);font-weight:bold}
.nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px}
.nav button{padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font:inherit}
.nav button.on{background:var(--navy);color:#fff}
</style>
</head>
<body>
<header>
  <h2 style="margin:0">نظام التميز الوظيفي – شركة دواجن فلسطين</h2>
  <p style="margin:4px 0 0;font-size:.9rem;opacity:.9">بوابة تقييم المشرفين المباشرة</p>
</header>
<main>
  <div class="nav" id="navAwards"></div>
  <div id="content"></div>
</main>
<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbztKiqIpRDagjM8Sj3Q-a3EjMa-ELuDsHOUcsasAG6x-0-6dfAuLq8dHmF7MuTcv5g0/exec";

const AW=[
 {id:"month",name:"موظف الشهر"},
 {id:"dept",name:"نجم الدوائر"},
 {id:"ops",name:"نجوم العمليات"},
 {id:"trk",name:"نجوم نقل الريش",conv:73},
 {id:"disc",name:"الموظف المنضبط"}
];
const CR=["الالتزام بأوقات الدوام","مستوى التغيب والمغادرات","الالتزام بأنظمة العمل","المحافظة على الممتلكات","الإلمام بالوصف الوظيفي","تنظيم العمل وسهولة المتابعة","اللباقة وحسن التعامل","وضوح التعبير عن الأفكار","العمل والإنجاز ضمن الفريق","تحمل المسؤولية في المواعيد","تطبيق أساليب جديدة بفعالية","اتخاذ القرار في غياب التعليمات","الاستعداد لتعليم الآخرين","التأكد دائماً من جودة العمل","مهارات التواصل","أفكار جديدة ترفع العمل","الاستفادة من الملاحظات للتحسين"];

let activeAw = AW[0];

function buildNav(){
  document.getElementById("navAwards").innerHTML = AW.map(a=>`<button class="${a.id===activeAw.id?'on':''}" onclick="setAw('${a.id}')">${a.name}</button>`).join("");
}

function setAw(id){
  activeAw = AW.find(x=>x.id===id);
  buildNav();
  renderForm();
}

function renderForm(){
  const now = new Date();
  const per = String(now.getMonth()+1).padStart(2,"0") + "/" + now.getFullYear();
  let h = `<div class="card">
    <h3 style="margin-top:0;color:var(--navy)">نموذج تقييم: ${activeAw.name}</h3>
    <label>اسم المشرف المقيّم</label><input id="f_sup" placeholder="اسمك">
    <label>الدائرة / القسم</label><input id="f_dep" placeholder="القسم">
    <label>اسم الموظف المرشح</label><input id="f_emp" placeholder="اسم الموظف">
    <label>فترة التقييم</label><input id="f_per" value="${per}" readonly>
    ${activeAw.conv ? `<label>نسبة التحويل الكلية (%)</label><input type="number" id="f_conv" placeholder="الحد الأدنى 73%">`:''}
    <h4 style="margin:16px 0 6px;color:var(--pri)">تقييم المعايير (من 1 إلى 5)</h4>`;
  CR.forEach((c,i)=>{
    h += `<div class="crit"><div style="flex:1">${i+1}. ${c}</div>
      <select id="s_${i}" style="width:75px" onchange="calcTotal()">
        <option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option>
      </select></div>`;
  });
  h += `<div style="font-size:1.2rem;margin-top:14px">المجموع الكلي: <b id="t85" class="ok">85</b> من 85</div>
    <label>ملاحظات</label><textarea id="f_note" rows="2"></textarea>
    <button class="btn" id="btnSave" onclick="sendEval()">إرسال التقييم للشيت مباشرة</button>
    <div id="msg"></div></div>`;
  document.getElementById("content").innerHTML = h;
  calcTotal();
}

function calcTotal(){
  let s = 0;
  CR.forEach((c,i)=>{ s += +(document.getElementById("s_"+i).value||0); });
  document.getElementById("t85").textContent = s;
}

async function sendEval(){
  const sup = document.getElementById("f_sup").value.trim();
  const dep = document.getElementById("f_dep").value.trim();
  const emp = document.getElementById("f_emp").value.trim();
  const msg = document.getElementById("msg");
  if(!sup || !dep || !emp){ alert("يرجى ملء جميع الحقول المطلوبة"); return; }
  
  let s = 0;
  CR.forEach((c,i)=>{ s += +(document.getElementById("s_"+i).value||0); });

  const payload = {
    supervisor: sup,
    dep: dep,
    emp: emp,
    award: activeAw.name,
    period: document.getElementById("f_per").value,
    score: s,
    conv: document.getElementById("f_conv") ? document.getElementById("f_conv").value : "-",
    notes: document.getElementById("f_note").value
  };

  const btn = document.getElementById("btnSave");
  btn.disabled = true;
  btn.textContent = "جارٍ الحفظ في Google Sheets...";
  try {
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    msg.innerHTML = '<p class="ok">✔ تم حفظ التقييم بنجاح في ملف Google Sheet!</p>';
    btn.textContent = "تم الإرسال";
    setTimeout(()=>{ renderForm(); }, 2000);
  } catch(e) {
    msg.innerHTML = '<p style="color:var(--bad)">حدث خطأ أثناء الإرسال، تأكد من الاتصال بالإنترنت.</p>';
    btn.disabled = false;
    btn.textContent = "إعادة المحاولة";
  }
}

buildNav();
renderForm();
</script>
</body>
</html>
