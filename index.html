<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة المشرفين – التقييم</title>
<style>
:root{box-sizing:border-box;--bg:#f3f8f1;--card:#fff;--tx:#1b2330;--mut:#5a6677;--pri:#0f7a3a;--pri2:#e2f4e6;--bd:#d3e2d3;--bad:#c0392b;--navy:#20207f}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;font-size:14pt}
header{padding:18px 16px;display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,#17175f,#20207f 50%,#0f7a3a);border-bottom:4px solid #00b030;color:#fff}
header h1{margin:0;font-size:1.45rem}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--bg);position:sticky;top:0;z-index:5}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--navy);color:#fff}
main{max-width:860px;margin:0 auto;padding:8px 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--pri);border-radius:12px;padding:16px;margin:12px 0}
.crit{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd)}
label{display:block;margin:10px 0 4px;font-size:.95rem;color:var(--mut)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;box-sizing:border-box}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 20px;font:inherit;cursor:pointer;margin-top:12px;width:100%}
.ok{color:var(--pri);font-weight:bold}
.bad{color:var(--bad);font-weight:bold}
.tile{border:1px solid var(--bd);background:var(--card);border-right:4px solid var(--pri);border-radius:12px;padding:14px;margin:8px 0;cursor:pointer;width:100%;text-align:right}
</style>
</head>
<body>
<header>
  <div>
    <h1>بوابة المسؤولين – نظام التميز الوظيفي</h1>
    <p style="margin:2px 0 0;font-size:.9rem;opacity:.9">شركة دواجن فلسطين – عزيزا</p>
  </div>
</header>
<div id="authBox" style="max-width:400px;margin:30px auto;padding:0 14px">
  <div class="card">
    <h3 style="margin-top:0;color:var(--navy)">تسجيل دخول المشرف</h3>
    <label>اسم المشرف / المعرّف</label>
    <input id="u_name" placeholder="مثال: م. فادي محمود">
    <label>القسم / الدائرة</label>
    <input id="u_dep" placeholder="مثال: دائرة الصيانة">
    <button class="btn" onclick="login()">دخول إلى البوابة</button>
  </div>
</div>

<div id="appBox" style="display:none">
  <div style="background:var(--card);padding:8px 16px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center">
    <span>مرحباً <b id="dspUser"></b> (<span id="dspDep"></span>)</span>
    <button onclick="logout()" style="border:1px solid var(--bd);background:transparent;padding:4px 10px;border-radius:6px;cursor:pointer">خروج</button>
  </div>
  <nav id="navBar"></nav>
  <main id="mainContent"></main>
</div>

<script>
const AW=[
 {id:"month",name:"موظف الشهر",freq:"شهري"},
 {id:"dept",name:"نجم الدوائر",freq:"نصف سنوي"},
 {id:"ops",name:"نجوم العمليات",freq:"ربع سنوي"},
 {id:"trk",name:"نجوم سيارات نقل الريش",freq:"شهري",conv:73},
 {id:"disc",name:"الموظف المنضبط",freq:"كل 3 شهور"}
];

const CR=["مدى التزام الموظف بأوقات الدوام","مستوى التغيب والمغادرات","التزام الموظف بأنظمة العمل","المحافظة على الممتلكات العامة","الإلمام بالوصف الوظيفي","تنظيم العمل وسهولة المتابعة","اللباقة وحسن التعامل","وضوح التعبير عن الأفكار","العمل والإنجاز ضمن الفريق","تحمل المسؤولية في المواعيد","تطبيق أساليب جديدة بفعالية","اتخاذ القرار في غياب التعليمات","الاستعداد لتعليم الآخرين","التأكد دائماً من جودة العمل","مهارات الاستماع والتواصل","تقديم أفكار جديدة ترفع العمل","الاستفادة من الملاحظات للتحسين"];

let supervisor = JSON.parse(localStorage.getItem("active_supervisor") || "null");

function login(){
  const n = document.getElementById("u_name").value.trim();
  const d = document.getElementById("u_dep").value.trim();
  if(!n || !d){ alert("الرجاء إدخال الاسم والقسم"); return; }
  supervisor = { name: n, dep: d };
  localStorage.setItem("active_supervisor", JSON.stringify(supervisor));
  startApp();
}

function logout(){
  localStorage.removeItem("active_supervisor");
  location.reload();
}

function startApp(){
  document.getElementById("authBox").style.display="none";
  document.getElementById("appBox").style.display="block";
  document.getElementById("dspUser").textContent = supervisor.name;
  document.getElementById("dspDep").textContent = supervisor.dep;
  buildNav("month");
}

function buildNav(cur){
  const nav = document.getElementById("navBar");
  nav.innerHTML = AW.map(a=>`<button class="${a.id===cur?'on':''}" onclick="renderAward('${a.id}')">${a.name}</button>`).join("") +
  `<button class="${cur==='list'?'on':''}" onclick="renderList()">تقييماتي السابقة</button>`;
  if(cur!=='list') renderAward(cur);
}

function renderAward(id){
  const a = AW.find(x=>x.id===id);
  const now = new Date();
  const per = (now.getMonth()+1).toString().padStart(2,"0") + "/" + now.getFullYear();
  let h = `<div class="card">
    <h2 style="margin:0;color:var(--pri)">${a.name} (${a.freq})</h2>
    <label>اسم الموظف المرشح</label><input id="emp_name">
    <label>الفترة</label><input id="emp_per" value="${per}" readonly>
    <label>القسم</label><input id="emp_dep" value="${supervisor.dep}">
    ${a.conv ? `<label>نسبة التحويل الكلية (%)</label><input type="number" id="emp_conv" placeholder="الحد الأدنى 73%">`:''}
    <h3 style="margin-top:16px;color:var(--navy)">بنود التقييم (من 1 إلى 5)</h3>`;
  
  CR.forEach((c,i)=>{
    h += `<div class="crit"><div style="flex:1">${i+1}. ${c}</div>
    <select id="s_${i}" style="width:80px" onchange="calcTotal()">
      <option value="5">5</option><option value="4">4</option><option value="3">3</option><option value="2">2</option><option value="1">1</option>
    </select></div>`;
  });

  h += `<div style="font-size:1.2rem;margin-top:12px">المجموع من 85: <b id="tot85" class="ok">85</b></div>
  <label>ملاحظات</label><textarea id="emp_notes" rows="2"></textarea>
  <button class="btn" onclick="saveEvaluation('${a.id}','${a.name}')">حفظ وإرسال التقييم</button>
  <div id="saveMsg"></div></div>`;
  document.getElementById("mainContent").innerHTML = h;
  calcTotal();
}

function calcTotal(){
  let s = 0;
  CR.forEach((c,i)=>{ s += +(document.getElementById("s_"+i).value || 0); });
  document.getElementById("tot85").textContent = s;
}

function saveEvaluation(aid, aname){
  const name = document.getElementById("emp_name").value.trim();
  if(!name){ alert("الرجاء كتابة اسم الموظف"); return; }
  let s = 0; const scores = [];
  CR.forEach((c,i)=>{ const v = +document.getElementById("s_"+i).value; scores.push(v); s += v; });
  const item = {
    id: "eval_" + Date.now(),
    awardId: aid, awardName: aname,
    empName: name, dep: document.getElementById("emp_dep").value,
    period: document.getElementById("emp_per").value,
    supervisor: supervisor.name,
    s85: s, scores: scores,
    conv: document.getElementById("emp_conv") ? document.getElementById("emp_conv").value : null,
    notes: document.getElementById("emp_notes").value,
    date: new Date().toLocaleDateString("ar")
  };
  const list = JSON.parse(localStorage.getItem("aziza_evals") || "[]");
  list.unshift(item);
  localStorage.setItem("aziza_evals", JSON.stringify(list));
  
  // توليد نص للمشاركة السريعة عبر واتساب للإدارة مباشرة
  const waText = encodeURIComponent(`*تقييم تميز وظيفي - عزيزا*%0Aالمشرف: ${supervisor.name}%0Aالموظف: ${name}%0Aالجائزة: ${aname}%0Aالنتيجة: ${s}/85%0Aالفترة: ${item.period}`);
  document.getElementById("saveMsg").innerHTML = `<p class="ok">✔ تم حفظ التقييم محلياً بنجاح!</p>
  <a href="https://wa.me/?text=${waText}" target="_blank" class="btn" style="background:#25D366;text-decoration:none;display:block;text-align:center">إرسال النتيجة للإدارة عبر WhatsApp</a>`;
}

function renderList(){
  const list = JSON.parse(localStorage.getItem("aziza_evals") || "[]");
  let h = `<div class="card"><h2 style="color:var(--navy)">التقييمات المسجلة على هذا الجهاز</h2>`;
  if(!list.length) h += `<p>لا توجد تقييمات محفوظة بعد.</p>`;
  else{
    list.forEach(r=>{
      h += `<div class="crit" style="justify-content:space-between">
        <div><b>${r.empName}</b> (${r.awardName})<br><span style="font-size:.85rem;color:var(--mut)">${r.period} · ${r.dep}</span></div>
        <div style="font-size:1.1rem" class="ok">${r.s85} / 85</div>
      </div>`;
    });
  }
  h += `</div>`;
  document.getElementById("mainContent").innerHTML = h;
}

if(supervisor) startApp();
</script>
</body>
</html>
