<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة المسؤولين – التقييم</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f8f1;--card:#fff;--tx:#1b2330;--mut:#5a6677;--pri:#0f7a3a;--pri2:#e2f4e6;--bd:#d3e2d3;--ok:#0f7a3a;--bad:#c0392b;--gold:#e0a800;--navy:#20207f;--yel:#f4c20d}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a14;--card:#18251d;--tx:#eaf2ec;--mut:#9db3a4;--pri:#3fd072;--pri2:#1d3a29;--bd:#2c4234;--ok:#5fdc8a;--bad:#ff8d80;--gold:#f4c20d;--navy:#9ea0ff;--yel:#f4c20d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
header{padding:18px 16px 16px;display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,#17175f,#20207f 50%,#0f7a3a);border-bottom:4px solid #00b030}
header img{width:72px;height:72px;border-radius:50%;background:#fff;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
h1{margin:0;font-size:1.45rem;color:#fff}
header p{margin:2px 0 0;color:#e8f6ec;font-size:.92rem}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:20px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{background:#20207f;color:#fff;border-color:#20207f}
main{max-width:860px;margin:0 auto;padding:8px 14px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.card{border-top:3px solid var(--pri)}
.card h2,.card h3{margin:0 0 8px;color:var(--pri)}
.tag{display:inline-block;background:var(--pri2);color:var(--pri);border-radius:12px;padding:2px 10px;font-size:.85rem;margin-left:6px}
ul{margin:6px 0;padding-right:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.tile{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:14px;text-align:right;font:inherit;color:var(--tx)}
.tile:hover{border-color:var(--pri)}
.tile{border-right:4px solid var(--pri)}
.tile b{display:block;color:var(--navy)}
.tile span{color:var(--mut);font-size:.85rem}
label{display:block;margin:10px 0 4px;font-size:.9rem;color:var(--mut)}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.crit{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--bd)}
.crit input{width:auto;margin-top:6px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:10px 20px;font:inherit;cursor:pointer;margin-top:12px}
.btn.s{background:transparent;color:var(--bad);border:1px solid var(--bd);padding:3px 10px;margin:0}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
.gold{color:var(--gold);font-weight:700}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
.note{font-size:.85rem;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--pri);border-radius:12px;padding:12px;text-align:center}
.kpi b{display:block;font-size:1.8rem;color:var(--navy)}
.kpi span{color:var(--mut);font-size:.85rem}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.9rem}
.bar i{display:block;height:14px;border-radius:7px;background:var(--pri);min-width:3px}
.bar em{width:150px;font-style:normal;flex:none}
.ubar{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd);font-size:.9rem}.ubar button{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}.auth{max-width:380px;margin:20px auto;padding:0 14px}
html{font-size:13pt}
body{font-family:"Sakkal Majalla","Traditional Arabic",Tahoma,Arial,sans-serif;font-size:1rem}
button,input,select,textarea{font-family:inherit}
nav button,.note,th,td,label,.tile span,.kpi span,.bar,.ubar,.ubar button,.tag,.crit,.btn,input,select,textarea,.k,.k i{font-size:1rem}
</style>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import * as A from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import * as S from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
try{const app=initializeApp(window.FIREBASE_CONFIG);window.FB=Object.assign({},A,S,{initializeApp,app,auth:A.getAuth(app),db:S.getFirestore(app)})}catch(e){window.FBERR=e}
window.dispatchEvent(new Event("fbready"));
</script>
</head>

function mtxt(a){return a.m.length===12?"كل شهر":"أشهر "+a.m.join(" + ")}
function per(a){const n=new Date(),pk=n.getFullYear()*12+n.getMonth(),f=(y,m)=>String(m).padStart(2,"0")+"/"+y,py=Math.floor((pk-1)/12),pm=(pk-1)%12+1;

const CR=["مدى التزام الموظف بأوقات الدوام والدقة في المواعيد","مستوى التغيب والمغادرات غير الضرورية","التزام الموظف بالعمل واحترامه لأنظمة وتعليمات العمل","مستوى المحافظة على الممتلكات العامة والأجهزة المستخدمة","مدى إلمام الموظف بوصفه الوظيفي وطبيعة العمل","مستوى تنظيم الموظف لعمله بحيث يتمكن زملاؤه من متابعة العمل من بعده في حال غيابه","لباقة الموظف وحسن تعامله مع زملائه","يعبر عن آرائه وأفكاره بوضوح","القدرة على العمل والانجاز ضمن المجموعة","يقبل بتحمل المسؤوليات وينجز المهام في الأوقات المحددة","يطبق مفاهيم وأساليب جديدة مرتبطة بعمله بشكل فعال","يتخذ القرار المناسب عند غياب التعليمات المفصلة","يظهر الاستعداد لتعليم الآخرين","يتأكد دائما من جودة واكتمال عمله","يتقن مهارات الاستماع و/أو التحدث و/أو الكتابة","يقدم أفكار جديدة ترفع من مستوى العمل","يستفيد من الملاحظات لتحسين مستوى الأداء"];
const nav=document.getElementById("nav"),main=document.getElementById("main");
const tabs=[["home","الجوائز"],...AW.map(a=>[a.id,a.name]),["log","تقييماتي"]];

function can(id){return(!U.only||U.only.includes(id))&&!(U.except&&U.except.includes(id))}

 main.innerHTML=t==="home"?home():t==="log"?log():awardS(AW.find(a=>a.id===t));const A0=AW.find(a=>a.id===t);if(A0&&(!can(t)||(!U.demo&&!A0.m.includes(new Date().getMonth()+1)))){const c=main.querySelectorAll(".card");c[c.length-1].remove()}const e=document.getElementById("f_ev");if(e)e.value=U.n;window.scrollTo(0,0)}
function home(){const cm=new Date().getMonth()+1,due=AW.filter(a=>(U.demo||a.m.includes(cm))&&can(a.id));
 return `<div class="card"><h2>مرحباً ${U.n}</h2><p class="note" style="margin:0 0 8px">نظام التميز الوظيفي – شركة دواجن فلسطين</p>
 <p>يهدف النظام إلى اختيار الموظفين المتميزين بآلية <b>واضحة وشفافة</b> تقوم على معايير محددة، وتحفيزهم باعتبارهم المورد الأهم ورأس المال الأكبر للشركة، وبناء بيئة عمل احترافية وفريق متعاون ومتحد.</p></div>
 <div class="card"><h3>كيف يتم التقييم؟</h3><ol style="padding-right:20px;margin:6px 0"><li>اختر من الأسفل الجائزة المفعّلة لهذا الشهر.</li><li>اختر الموظف من قائمتك، وقيّم <b>جميع</b> البنود من 1 إلى 5 (لا يمكن الحفظ قبل إكمالها).</li><li>اضغط «حفظ التقييم»، فيصل تقييمك للإدارة <b>تلقائياً</b>، وتتابع حالته من تبويب «تقييماتي».</li><li>تستكمل الإدارة تصويت اللجنة (15 نقطة) ويُحتسب المجموع النهائي من 100.</li></ol><p class="note" style="margin:8px 0 0"><b>مهم:</b> يمكنك حذف التقييم قبل اعتماده من تبويب «تقييماتي»، وبعد الاعتماد يصبح نهائياً.</p></div>
 <div class="card"><h3>الجوائز المفعّلة هذا الشهر</h3>${due.length?due.map(a=>`<button class="tile" style="width:100%;margin:4px 0" onclick="go('${a.id}')"><b>${a.name}</b><span>${a.freq} · اضغط لبدء التقييم</span></button>`).join(""):'<p class="note">لا توجد جوائز مفعّلة لك هذا الشهر.</p>'}</div>`+honorCard()+homeOld()}
function homeOld(){return `<h3 style="margin:16px 4px 8px;color:var(--pri)">تفاصيل الجوائز (المعايير والحوافز)</h3>
<div class="grid">${AW.filter(a=>!(U.except&&U.except.includes(a.id))).map(a=>`<button class="tile" onclick="go('${a.id}')"><b>${a.name}</b><span>${a.freq} · ${mtxt(a)} · ${a.who}</span></button>`).join("")}
</div>`}
function awardS(a){
 return `<div class="card"><h2>${a.name}</h2><span class="tag">${a.freq}</span><span class="tag">${mtxt(a)}</span><span class="tag">${a.who}</span><p>${a.desc}</p>
 <h3>الحوافز</h3><ul>${a.inc.map(i=>`<li>${i}</li>`).join("")}</ul>${a.info?`<h3>الشروط (للعلم)</h3><ul>${a.info.map(c=>`<li>${typeof c==="string"?c:c.t}</li>`).join("")}</ul>`:""}</div>
 <div class="card"><h3>الهدف</h3><p>وضع آلية واضحة وشفافة يتم من خلالها اختيار الموظف المثالي في كل دائرة / قسم في الشركة، وخلق فريق عمل متعاون ومتحد، وتحفيز الموظفين إلى تكوين بيئة عمل احترافية.</p>
 <h3>آلية الاختيار</h3><ul><li>يرشح كل مدير دائرة أو رئيس قسم اثنين من الموظفين.</li><li>يتم بعدها وضع الموظفين على قائمة التصويت من قبل لجنة التقييم (المدير العام والمدير الإداري) ليتم ترشيح موظف واحد.</li><li>يتم احتساب تقييم مدير الدائرة / رئيس القسم من 85 نقطة، وتصويت اللجنة على 15 نقطة، بحيث يحتسب المعدل، وبعد ذلك يتم احتساب النتيجة النهائية للموظفين.</li></ul></div>
 <div class="card"><h3>نموذج التقييم (التقييم من 1 - 5)</h3>
 <label>اسم الموظف</label>${nameF()}
 <label>القسم / الدائرة</label>${depF()}
 <label>فترة التقييم (${mtxt(a)})</label>${per(a)}
 <label>اسم المقيّم (مدير الدائرة / رئيس القسم)</label><input id="f_ev">
 ${a.conv?`<div class="crit" style="align-items:center"><div style="flex:1">1. تحديد نسبة التحويل الكلية خلال الفترة (%)<br><span class="note">الحد الأدنى ${a.conv}% – تُسجَّل ولا تدخل في مجموع الـ 85</span></div><div style="width:110px"><input type="number" id="conv" step="0.01" min="0" oninput="calcS()"><span id="convst" class="note"></span></div></div>`:""}${CR.map((c,i)=>`<div class="crit"><div style="flex:1">${i+1+(a.conv?1:0)}. ${c}</div><select id="s${i}" style="width:80px" onchange="calcS()"><option value="">-</option>${[1,2,3,4,5].map(n=>`<option>${n}</option>`).join("")}</select></div>`).join("")}
 <p><b>المجموع من 85:</b> <span id="t85">0</span></p>
 <p class="note">بعد الحفظ يُرسَل التقييم للإدارة لاستكمال تصويت اللجنة واحتساب النتيجة النهائية.</p>
 <label>ملاحظات</label><textarea id="f_note" rows="2"></textarea>
 <button class="btn" onclick="submitS('${a.id}')">حفظ التقييم</button><div id="msg"></div></div>`}
function calcS(){const cv=document.getElementById("conv");if(cv){const e=document.getElementById("convst"),ok=cv.value!==""&&+cv.value>=73;e.textContent=cv.value===""?"":ok?"✔ مستوفٍ":"✘ أقل من 73%";e.className=ok?"ok":"bad";if(cv.value!=="")cv.style.borderColor=""}
 let s=0;CR.forEach((c,i)=>{const e=document.getElementById("s"+i);if(e.value)e.style.borderColor="";s+=+e.value||0});
 document.getElementById("t85").textContent=s;return s}
async function submitS(id){const a=AW.find(x=>x.id===id),v=k=>$(k).value.trim(),m=$("msg");
 if(!v("f_name")){m.innerHTML='<p class="bad">الرجاء اختيار اسم الموظف</p>';return}
 const miss=[];if(a.conv&&$("conv").value==="")miss.push("conv");
 CR.forEach((c,i)=>{if(!$("s"+i).value)miss.push("s"+i)});
 if(miss.length){miss.forEach(k=>$(k).style.borderColor="var(--bad)");$(miss[0]).scrollIntoView({block:"center"});m.innerHTML=`<p class="bad">لا يمكن الحفظ قبل تقييم جميع البنود (المتبقي ${miss.length})</p>`;return}
 const s=calcS(),per=v("f_per"),emp=v("f_name"),key=a.id+"_"+per.replace("/","-")+"_"+emp.replace(/\s+/g,"_");
 try{await FB.setDoc(FB.doc(FB.db,"evaluations",key),{supervisorUid:U.uid,supervisorName:U.n,awardId:a.id,awardName:a.name,empName:emp,dep:v("f_dep"),period:per,scores:CR.map((x,i)=>+$("s"+i).value),s85:s,conv:a.conv?+$("conv").value:null,note:v("f_note"),status:"pending",createdAt:FB.serverTimestamp()});
  go(id);$("msg").innerHTML=`<p class="ok">✔ تم حفظ التقييم (${s} من 85) وإرساله للإدارة تلقائياً لاستكمال تصويت اللجنة.</p>`}
 catch(e){m.innerHTML='<p class="bad">'+(e.code==="permission-denied"?"تم تقييم هذا الموظف مسبقاً لهذه الفترة، أو لا تملك صلاحية.":"تعذر الحفظ، تأكد من الاتصال بالإنترنت")+'</p>'}}
function log(){
 const tb=recs.length?`<div class="card wrap"><table><tr><th>التاريخ</th><th>الجائزة</th><th>الاسم</th><th>القسم</th><th>الفترة</th><th>تقييمك</th><th>الحالة</th><th></th></tr>${recs.map(r=>`<tr><td>${r.d}</td><td>${r.aw}</td><td>${r.name}</td><td>${r.dep||""}</td><td>${r.per}</td><td>${r.s85}/85</td><td class="${r.status==="final"?"ok":"note"}">${isWinR(r)?"فائز ✔":(r.status==="final"?"معتمد":"بانتظار اللجنة")}</td><td>${r.status==="final"?"":`<button class="btn s" data-id="${esc(r.id)}" onclick="del(this)">حذف</button>`}</td></tr>`).join("")}</table></div>`:'<div class="card"><p>لا توجد تقييمات محفوظة بعد.</p></div>';
 return tb}
function nameF(){return U.emp&&U.emp.length?`<select id="f_name"><option value="">— اختر الموظف —</option>${U.emp.map(n=>`<option>${n}</option>`).join("")}</select>`:'<input id="f_name">'}
function depF(){return U.dep?`<input id="f_dep" value="${U.dep}" readonly>`:'<input id="f_dep">'}
function del(b){FB.deleteDoc(FB.doc(FB.db,"evaluations",b.dataset.id)).catch(()=>{})}
let U=null,recs=[],HON=[],unsub2=null;
const $=k=>document.getElementById(k),esc=t=>String(t).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
let unsub=null;
function isWinR(r){const w=HON.find(x=>x.awardName===r.aw&&x.period===r.per);return !!(w&&w.winners.some(y=>y.id===r.id))}
function honorCard(){const L=[...HON].sort((a,b)=>b.ts-a.ts).slice(0,10),mine=new Set(recs.filter(isWinR).map(r=>r.id));
 return `<div class="card"><h3>الفائزون المعلنون</h3>${L.length?`<div class="wrap"><table><tr><th>الجائزة</th><th>الفترة</th><th>الفائز</th><th></th></tr>${L.map(w=>w.winners.map((y,i)=>`<tr><td>${i?"":w.awardName}</td><td>${i?"":w.period}</td><td><b>${y.name}</b></td><td class="ok">${mine.has(y.id)?"⭐ من تقييمك":""}</td></tr>`).join("")).join("")}</table></div>`:'<p class="note">لم يتم إعلان فائزين بعد.</p>'}</div>`}
function toRec(id,d){return{id,aw:d.awardName,name:d.empName,dep:d.dep,per:d.period,s85:d.s85,status:d.status,d:d.createdAt?d.createdAt.toDate().toLocaleDateString("ar"):"",ts:d.createdAt?d.createdAt.toMillis():Date.now()}}
function showAuth(h){$("auth").className="auth";$("auth").innerHTML=h;$("nav").style.display="none";$("main").style.display="none";$("ubar").style.display="none"}
function loginView(m){showAuth(`<div class="card"><h2>تسجيل الدخول</h2>${m?`<p class="bad">${m}</p>`:""}<label>اسم المستخدم</label><input id="lu" autocomplete="username"><label>كلمة السر</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"><button class="btn" onclick="doLogin()">دخول</button></div>`)}
function authMsg(e){const c=e&&e.code||"";
 if(["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-login-credentials"].includes(c))return "اسم المستخدم أو كلمة السر غير صحيحة (تأكد من لغة لوحة المفاتيح)";
 if(c==="auth/operation-not-allowed")return "تسجيل الدخول بالبريد وكلمة السر غير مفعّل في Firebase (Authentication ← Sign-in method)";
 if(c==="auth/invalid-api-key"||c==="auth/api-key-not-valid.-please-pass-a-valid-api-key.")return "مفتاح apiKey في firebase-config.js غير صحيح";
 if(c==="auth/network-request-failed")return "تعذر الاتصال بالإنترنت";
 if(c==="auth/too-many-requests")return "محاولات كثيرة، انتظر قليلاً ثم أعد المحاولة";
 return "تعذر تسجيل الدخول ("+(c||e)+")"}
async function doLogin(){const u=$("lu").value.trim().toLowerCase(),p=$("lp").value;
 if(!u||!p)return loginView("أدخل اسم المستخدم وكلمة السر");
 let em=(u==="admin"?"admin":u)+"@exc.aziza";if(u!=="admin"){try{const dd=await FB.getDoc(FB.doc(FB.db,"directory",u));if(dd.exists())em=dd.data().email}catch(e){}}
 try{await FB.signInWithEmailAndPassword(FB.auth,em,p)}catch(e){loginView(authMsg(e))}}

async function savePw(first){const p1=$("p1").value,p2=$("p2").value,u=FB.auth.currentUser;
 if(!first){try{await FB.reauthenticateWithCredential(u,FB.EmailAuthProvider.credential(u.email,$("p0").value))}catch(e){return pwView(first,"كلمة السر الحالية غير صحيحة")}}
 if(p1.length<6)return pwView(first,"كلمة السر يجب ألا تقل عن 6 أحرف");
 if(p1!==p2)return pwView(first,"كلمة السر غير متطابقة");
 if(p1==="Aziza@123")return pwView(first,"اختر كلمة سر مختلفة عن المبدئية");
 try{await FB.updatePassword(u,p1);await FB.updateDoc(FB.doc(FB.db,"users",U.uid),{mustChange:false});U.mustChange=false}catch(e){return pwView(first,"تعذر تغيير كلمة السر ("+(e.code||"")+")")}
 startApp()}
function startApp(){recs=[];$("auth").innerHTML="";$("auth").className="";
 $("ubar").style.display="flex";$("ubar").innerHTML=`<span>مرحباً <b>${U.n}</b></span><span><button onclick="pwView(false)">تغيير كلمة السر</button> <button onclick="logout()">خروج</button></span>`;
 if(unsub)unsub();
 unsub=FB.onSnapshot(FB.query(FB.collection(FB.db,"evaluations"),FB.where("supervisorUid","==",U.uid)),sn=>{recs=sn.docs.map(d=>toRec(d.id,d.data())).sort((a,b)=>b.ts-a.ts);if(cur==="log"||cur==="home")go(cur)},()=>{});
 unsub2=FB.onSnapshot(FB.collection(FB.db,"honor"),sn=>{HON=sn.docs.map(d=>Object.assign({id:d.id,ts:d.data().announcedAt?d.data().announcedAt.toMillis():Date.now()},d.data()));if(cur==="home"||cur==="log")go(cur)},()=>{});
 $("nav").style.display="flex";$("main").style.display="block";go("home")}
async function logout(){if(unsub)unsub();unsub=null;if(unsub2)unsub2();unsub2=null;await FB.signOut(FB.auth)}
function boot(){
 if(!window.FB){return showAuth('<div class="card"><p class="bad">تعذر الاتصال بـ Firebase. تأكد من ملف firebase-config.js ومن الاتصال بالإنترنت.</p></div>')}
 FB.onAuthStateChanged(FB.auth,async u=>{
  if(u&&u.email==="admin@exc.aziza"){location.replace("admin.html");return}
  if(!u){U=null;recs=[];return loginView()}
  const sn=await FB.getDoc(FB.doc(FB.db,"users",u.uid));
  if(!sn.exists()){await FB.signOut(FB.auth);return loginView("الحساب غير مفعّل، راجع الإدارة")}
  U=Object.assign({uid:u.uid},sn.data());U.n=U.name;U.u=U.username;U.only=U.only&&U.only.length?U.only:null;U.except=U.except&&U.except.length?U.except:null;
  U.mustChange?pwView(true):startApp()})}
if(window.FB||window.FBERR)boot();else window.addEventListener("fbready",boot);
</script>
